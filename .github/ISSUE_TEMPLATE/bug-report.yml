name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, production records, private endpoints, or unpatched vulnerability details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest synthetic example and exact commands.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and npm version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I verified that this report contains synthetic, non-sensitive data only.
          required: true
